<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>Marketplace</title>
    <style> 
     :root{
            --very-light-pink: #884d4d;
            --text-input-field: #c5c2f3;
            --hospital-green: #ACD9B2;
            --white: #ffffff;
            --black: #000000;
            --sn:14px;
            --md:16px;
            --lg:18px;
        }
        body{
            font-family: "Quicksand", sans-serif;
            margin: 0;
        }
       .card-container{
         display: grid;
         grid-template-columns: repeat(auto-Fill, 240px);
         gap: 26px;
       }
       .product-card{
        width: 250px;
       }
        .product-imagen {
            width: 230px;
            height: 220px;
            border-radius: 20px;
            object-fit: cover;
        }
        .btn-carrito {
            width: 20px;
            height: 30px;
        }
        .info-product{
            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        .info-product figure img{
            width: 35px;
            height: 35px;
        }

       @media (max-width: 640px) {
         .logo {
           display: block;
             }
        }
</style>   
</head>

<body>
    <section class="main-container">
        <div class="card-container">
            <div class="product-card">
                <img src="../Clase 1/Imagen/tazas.avif" alt="image-product" class="product-imagen">
                <div class="info-product">
                <div>
                   <p>$150.000</p>
                   <p>Set Mugs</p>
                </div>
                <figure>
                  <img src="../Clase 1/Imagen/Carrito.svg" alt="btn-carrito" class="btn-carrito">
               </figure>
               </div>
           </div>
           <div class="product-card">
                <img src="../Clase 1/Imagen/tazas.avif" alt="image-product" class="product-imagen">
                <div class="info-product">
                <div>
                   <p>$150.000</p>
                   <p>Set Mugs</p>
                </div>
                <figure>
                  <img src="../Clase 1/Imagen/Carrito.svg" alt="btn-carrito" class="btn-carrito">
               </figure>
               </div>
           </div>
       
    </div>   
  </section>
</body>
</html>
